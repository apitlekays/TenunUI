name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (macOS) and iOS build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme TenunUI -destination 'generic/platform=iOS' -quiet
